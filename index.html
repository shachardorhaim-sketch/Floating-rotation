<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating rotation</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- מה מופיע כששולחים קישור לאתר (וואטסאפ, טלגרם, פייסבוק) -->
<meta name="description" content="משחקים חינמיים, התקנות חינמיות ועוד — הכל במקום אחד.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Floating rotation">
<meta property="og:title" content="Floating rotation">
<meta property="og:description" content="משחקים חינמיים, התקנות חינמיות ועוד — הכל במקום אחד.">
<meta property="og:url" content="https://floatingrotations.com/">
<meta property="og:image" content="https://floatingrotations.com/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Floating rotation">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="style.css?v=hub-11">
</head>
<body class="site">

<!-- ============ החנות (מסך ראשי) ============ -->
<div id="store">
  <div class="site-body">
    <!-- הקטגוריות: פס לכל אורך הצד הימני, בכל השפות. כפתור ☰ מסתיר אותו (נבנה ב-hub.js) -->
    <aside class="side" id="side">
      <div class="side-head">
        <span class="side-title" id="sideTitle">קטגוריות</span>
        <button class="side-close" id="sideClose">×</button>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
    </aside>
    <div class="side-shade" id="sideShade"></div>

    <div class="site-col">
      <header class="site-head">
        <button class="side-toggle" id="sideToggle" aria-controls="side" aria-expanded="true">☰</button>
        <a class="logo" id="homeLink" href="./"><img class="logo-icon" src="logo-icon.png" alt="">Floating<span>rotation</span></a>
      </header>

      <main class="site-main">
        <!-- דף הבית: כאן יופיעו דברים בתשלום. כרגע אין — אז הוא ריק -->
        <section class="view-home" id="view-home"></section>

        <!-- קטגוריה: משחקים חינמיים -->
        <section class="cat-sec" id="cat-games" hidden>
          <div class="cat-head"></div>
          <div class="grid" id="grid"></div>
        </section>

        <!-- קטגוריה: התקנות חינמיות -->
        <section class="cat-sec" id="cat-apps" hidden>
          <div class="cat-head"></div>
          <div class="grid dl-grid" id="dlGrid"></div>
        </section>

        <!-- מסך משחק (#play/<id>): המשחק במסגרת, פס עם השם והכפתורים, ועוד משחקים (hub.js) -->
        <section class="game-view" id="gameHost" hidden>
          <div class="player" id="player">
            <div id="gameMount"></div>
          </div>
          <div class="player-bar">
            <div class="pb-info">
              <span class="pb-thumb" id="gameThumb"></span>
              <div class="pb-text">
                <h1 id="gameTitle"></h1>
                <span class="pb-type" id="gameType"></span>
              </div>
            </div>
            <div class="pb-actions">
              <button class="pb-btn" id="fullBtn">⛶</button>
              <button class="pb-btn" id="backBtn">✕</button>
            </div>
          </div>
          <div class="more-games">
            <h2 id="moreTitle">עוד משחקים</h2>
            <div class="more-row" id="moreRow"></div>
          </div>
        </section>

        <footer class="site-foot">נבנה על ידי שחר דור-חיים ורובין שמואלי · Floating rotation 2026</footer>
      </main>
    </div>
  </div>
</div>


<!-- ============ הקבצים ============ -->
<!-- חשוב: הסדר חשוב! קודם הנתונים, אחר כך המשחקים, ובסוף הפלטפורמה -->

<!-- 1. הדמויות והתמונות (קובץ כבד — לא נוגעים בו) -->
<script src="sprites.js"></script>

<!-- 2. קטלוג הדמויות (שמות ומחירים) -->
<script src="characters.js"></script>

<!-- 3. המשחקים -->
<!-- PeerJS — למשחק שחמט מרחוק (חינם, בלי שרת) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game-dino.js?v=2"></script>
<script src="game-star-catcher.js?v=2"></script>
<script src="game-memory.js"></script>
<script src="game-chess.js"></script>
<script src="game-tetris.js?v=2"></script>
<!-- 4. הפלטפורמה (חייב להיות אחרון!) -->
<script src="platform.js?v=hub-9"></script>

<!-- 5. ההדגמה המונפשת (חייבת להיטען לפני downloads.js) -->
<script src="demo.js"></script>

<!-- 6. אזור ההורדות (אחרי הפלטפורמה — מאזין לשינוי שפה) -->
<script src="downloads.js?v=hub-1"></script>

<!-- 6. הזרקת כתובת ה-bookmarklet לקישור (חייב להיות אחרי downloads.js) -->
<script src="bookmarklet.js"></script>

<!-- 7. הקטגוריות: ניווט, אריחים וכותרות (אחרון — סופר את הכרטיסים של כולם) -->
<script src="hub.js?v=hub-6"></script>

</body>
</html>
